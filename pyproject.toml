[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-inmatch-prediction"
version = "0.1.0"
description = "Research project for machine learning-based football in-match event prediction"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Daniyar Sabirov" },
]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.1,<4",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
research = [
  "jupyterlab>=4,<5",
]
test = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
